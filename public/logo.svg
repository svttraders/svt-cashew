<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" fill="none">
  <defs>
    <linearGradient id="svtGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF3D5" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7A1E" />
    </linearGradient>
    <linearGradient id="svtGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDF73" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.2" />
    </linearGradient>
    <filter id="goldDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#goldDropShadow)" stroke="url(#svtGoldGrad)" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- ================= CROWN (MUKUT) ================= -->
    <!-- Top Finial Peak -->
    <path d="M 250 75 C 247 62 250 50 250 50 C 250 50 253 62 250 75 Z" stroke-width="4.5" fill="none" />
    <circle cx="250" cy="45" r="3.5" fill="url(#svtGoldGrad)" stroke="none" />
    <path d="M 240 78 C 245 70 255 70 260 78" stroke-width="4" fill="none" />
    
    <!-- Crown Upper Tier Arch -->
    <path d="M 235 90 C 242 80 258 80 265 90" stroke-width="4.5" fill="none" />
    <path d="M 232 92 C 230 115 270 115 268 92" stroke-width="4.5" fill="none" />
    <path d="M 250 94 L 250 110" stroke-width="3.5" />

    <!-- Center Teardrop Jewel in Crown -->
    <path d="M 250 116 C 244 125 244 135 250 144 C 256 135 256 125 250 116 Z" stroke-width="4" fill="none" />

    <!-- Ornate Crown Side Flourishes (Filigree Wings) -->
    <!-- Left Wing Filigree -->
    <path d="M 230 115 C 220 95 190 100 195 125 C 200 140 220 142 232 145" stroke-width="4.5" fill="none" />
    <path d="M 215 122 C 210 112 198 115 200 128 C 202 136 212 138 220 138" stroke-width="3" fill="none" />
    <path d="M 188 135 C 185 142 195 152 210 152 C 222 152 230 146 235 145" stroke-width="4.5" fill="none" />
    
    <!-- Right Wing Filigree -->
    <path d="M 270 115 C 280 95 310 100 305 125 C 300 140 280 142 268 145" stroke-width="4.5" fill="none" />
    <path d="M 285 122 C 290 112 302 115 300 128 C 298 136 288 138 280 138" stroke-width="3" fill="none" />
    <path d="M 312 135 C 315 142 305 152 290 152 C 278 152 270 146 265 145" stroke-width="4.5" fill="none" />

    <!-- Crown Base Arch Bands -->
    <path d="M 190 155 C 220 142 280 142 310 155" stroke-width="5" fill="none" />
    <path d="M 200 168 C 225 156 275 156 300 168" stroke-width="4.5" fill="none" />
    <path d="M 212 180 C 230 170 270 170 288 180" stroke-width="4.5" fill="none" />

    <!-- Crown Band Beads -->
    <circle cx="250" cy="158" r="3.5" fill="url(#svtGoldGrad)" stroke="none" />
    <circle cx="218" cy="164" r="3" fill="url(#svtGoldGrad)" stroke="none" />
    <circle cx="282" cy="164" r="3" fill="url(#svtGoldGrad)" stroke="none" />

    <!-- ================= SACRED TILAK ================= -->
    <!-- Oval Base -->
    <path d="M 243 205 C 243 198 257 198 257 205 C 257 212 243 212 243 205 Z" stroke-width="4" fill="none" />
    <!-- Center Teardrop Tilak -->
    <path d="M 250 216 C 244 226 244 236 250 244 C 256 236 256 226 250 216 Z" stroke-width="4" fill="none" />

    <!-- ================= LEFT EAR & TUSK ================= -->
    <!-- Left Ear Inner & Outer Wing -->
    <path d="M 152 195 L 202 188 C 205 240 216 295 248 340" stroke-width="5.5" fill="none" />
    <path d="M 152 195 C 160 240 185 275 220 285" stroke-width="5.5" fill="none" />
    <!-- Left Tusk (Danta) -->
    <path d="M 220 285 C 235 305 242 318 220 320 C 232 305 238 290 238 275" stroke-width="4.5" fill="none" />

    <!-- ================= RIGHT EAR & TUSK ================= -->
    <!-- Right Ear Inner & Outer Wing -->
    <path d="M 348 195 L 298 188 C 295 240 284 295 252 340" stroke-width="5.5" fill="none" />
    <path d="M 348 195 C 340 240 315 275 280 285" stroke-width="5.5" fill="none" />
    <!-- Right Small Tusk Curve -->
    <path d="M 280 285 C 265 305 258 318 280 320 C 268 305 262 290 262 275" stroke-width="4.5" fill="none" />

    <!-- ================= MAIN TRUNK (SONDH) ================= -->
    <!-- Outer Trunk Curve (Smooth Flowing Arch) -->
    <path d="M 202 188 C 206 255 212 320 250 375 C 285 425 345 440 370 415 C 395 390 395 335 348 305 C 300 275 292 230 298 188" stroke-width="5.5" fill="none" stroke-linecap="round" />

    <!-- Inner Trunk Spiral Line -->
    <path d="M 248 340 C 275 390 325 410 350 392 C 372 376 372 342 340 325 C 315 312 300 330 312 350 C 322 365 348 360 352 342" stroke-width="5.5" fill="none" stroke-linecap="round" />

    <!-- Trunk Lower Curve Loop Detail -->
    <path d="M 250 375 C 275 420 315 440 340 435 C 370 430 388 400 380 370 C 372 345 350 340 335 355 C 325 365 330 380 345 385" stroke-width="5" fill="none" stroke-linecap="round" />

  </g>
</svg>
